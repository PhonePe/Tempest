# gitleaks configuration: default rules plus the documented placeholder values.
[extend]
useDefault = true

[allowlist]
description = "Demo, example, and test placeholder credentials"
regexes = [
    '''tempest-demo-key-2026''',
    '''replace-with-at-least-16-characters''',
    '''strong-api-key-123456''',
]
