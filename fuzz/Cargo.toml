[package]
name = "tempest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempest = { package = "tempest-ignition", path = "..", default-features = false }

[[bin]]
name = "packet_parse"
path = "fuzz_targets/packet_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "option_negotiation"
path = "fuzz_targets/option_negotiation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
