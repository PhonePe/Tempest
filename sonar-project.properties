# Shared SonarQube analysis settings for Tempest. Coverage comes from
# `make coverage-sql`. The sonar job in .github/workflows/ci.yml supplies the
# server and project identity. Never
# put a token or server URL in this file; CI supplies them from secrets and
# variables.
sonar.projectName=Tempest

# Rust tests live beside the code (tests.rs, *_tests.rs) and under tests/.
# Index them as tests, not production sources, so metrics and gates describe
# shipped code.
sonar.sources=src,crates/tempest-control-client/src
sonar.tests=src,crates/tempest-control-client/src,tests,crates/tempest-control-client/tests
sonar.test.inclusions=**/tests.rs,**/*_tests.rs,tests/**,crates/tempest-control-client/tests/**
sonar.exclusions=**/tests.rs,**/*_tests.rs,target/**

sonar.rust.lcov.reportPaths=target/coverage/lcov.info
# Compiled only without the sql-persistence feature, so the all-features coverage
# run cannot reach it; the minimal-profile CI test jobs exercise it instead.
sonar.coverage.exclusions=src/persistence_disabled.rs

sonar.sourceEncoding=UTF-8

# Fail the analysis step when the quality gate fails, so the check blocks merges.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
