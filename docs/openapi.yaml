openapi: 3.1.0
info:
  title: Tempest HTTP API
  version: 0.1.0
  summary: Release, session, artifact, health, audit, and observability API.
  description: |
    Tempest's control API manages profile-scoped boot releases and source-IP
    boot sessions. Control routes require the x-api-key header unless the
    explicitly insecure loopback development mode is enabled. Bearer artifact
    downloads do not accept that key as client authority; they
    require the one-time token returned when a boot session is registered. An
    explicitly enabled native UEFI HTTP Boot route instead requires the HTTP
    source address to have a live registered session and serves only its
    configured managed boot artifact. Tempest does not terminate TLS.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Health
  - name: Operations
  - name: Sessions
  - name: Releases
  - name: Artifacts
  - name: Audit
paths:
  /api/v2/delete/preview:
    post:
      tags: [Releases, Artifacts]
      operationId: previewDelete
      summary: Preview one explicit retained metadata or physical file deletion.
      description: |
        Requires api.enable_versions_api. No mutation, reservation, or stored token.
        Only inactive, locally unpinned retained groups are executable, with SQL
        disabled or persistence.coordinated_deletion enabled under the exclusive
        database-enforced single-serving-node protocol. A group and manifest are one
        metadata object; bytes are never removed. File previews always report
        byte_deletion_unavailable. File identities bind a stable capability-opened
        SHA-256 stream plus replacement metadata. Known file references are
        advisory, bounded to 100 groups/10000 members, and not cluster-wide.
        SQL eligibility additionally checks durable readers/sessions and exact
        identity. Coordination-disabled/unavailable or blocked SQL instances report
        persistence_coordination_unavailable. Legacy nodes require a stopped upgrade.
        A missing reference is not permission to unlink. File hashing is limited
        to 4 GiB and shares four bounded hashing workers. No transitive deletion.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target]
              properties:
                target:
                  $ref: '#/components/schemas/DeleteTarget'
      responses:
        '200':
          description: Advisory preview; can_delete false is not an HTTP error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Target missing or versions API disabled.
        '408':
          description: Request body read deadline exceeded.
        '413':
          description: Request body exceeds the configured bound.
        '415':
          description: Missing or unsupported JSON content type.
        '422':
          description: Typed JSON mismatch, unknown fields, or missing required fields; invalid JSON syntax returns 400.
        '429':
          description: Control API rate limit exceeded.
        '503':
          description: Control lock/workers busy, inspection exceeds bounds, or file identity cannot be proven.
  /api/v2/delete/confirm:
    post:
      tags: [Releases, Artifacts]
      operationId: confirmDelete
      summary: Confirm the exact preview identity; revalidate before metadata removal.
      description: |
        Requires api.enable_versions_api. Echo the unchanged preview target and
        expected_identity only after operator confirmation and caller-owned
        dependency checks. Core atomically rechecks group identity, active state,
        cutover and transfer/session pins. Coordinated SQL deletion commits the
        exact identity CAS, durable reader/session checks, reservation, permanent
        ownership tombstone and metadata removal before memory publication. SQL
        failure never falls back to memory-only removal. Other SQL profiles refuse.
        Byte deletion is
        always blocked, even for unmanaged files. Active withdrawal is separate.
        No force/cascade option. Repeated confirmation returns 404 after removal;
        a reused group ID with another manifest returns 409. After ambiguity or
        conflict, refresh state; never silently confirm a replacement identity.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDeleteRequest'
      responses:
        '200':
          description: Exact retained metadata removed; bytes preserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Target missing (including already deleted), or versions API disabled.
        '409':
          description: Identity changed (plain text) or deletion blocked (JSON blockers).
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required: [blockers]
                properties:
                  blockers:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/DeleteBlocker'
        '408':
          description: Request body read deadline exceeded.
        '413':
          description: Request body exceeds the configured bound.
        '415':
          description: Missing or unsupported JSON content type.
        '422':
          description: Typed JSON mismatch, unknown fields, or missing required fields; invalid JSON syntax returns 400.
        '429':
          description: Control API rate limit exceeded.
        '503':
          description: Control lock/workers busy, inspection exceeds bounds, or file identity cannot be proven.
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Check process liveness.
      security: []
      responses:
        "200":
          description: Process is running.
          content:
            text/plain:
              schema:
                type: string
                const: OK
  /ready:
    get:
      tags: [Health]
      operationId: readinessCheck
      summary: Check TFTP and critical-service readiness.
      security: []
      responses:
        "200":
          description: TFTP listener and critical services are ready.
          content:
            text/plain:
              schema:
                type: string
                const: READY
        "503":
          description: Server is starting, draining, degraded (including a lost deletion-mode serving lease), or its ordinary SQL snapshot has reached the configured maximum age.
          content:
            text/plain:
              schema:
                type: string
                enum: [STARTING, DRAINING, DEGRADED, STALE]
  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Return Prometheus text exposition when enabled.
      description: API-key authentication is required by default and may be disabled only for this route through `api.metrics_require_api_key`.
      security:
        - apiKey: []
        - {}
      responses:
        "200":
          description: Prometheus metrics, including fixed-label extension failure counters.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: API-key authentication is enabled and the key is missing or invalid.
        "404":
          description: Metrics route is disabled.
  /api/v1/info:
    get:
      tags: [Operations]
      operationId: serverInfo
      summary: Return bounded process and transfer information.
      security:
        - apiKey: []
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/transfers/active:
    get:
      tags: [Operations]
      operationId: activeTransfers
      summary: Return active-transfer count and drain state.
      security:
        - apiKey: []
      responses:
        "200":
          description: Current transfer state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTransfers"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/drain/status:
    get:
      tags: [Operations]
      operationId: drainStatus
      summary: Return drain state and completion predicate.
      security:
        - apiKey: []
      responses:
        "200":
          description: Current drain state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/drain:
    post:
      tags: [Operations]
      operationId: enableDrain
      summary: Reject new transfers while current transfers finish.
      security:
        - apiKey: []
      responses:
        "200":
          description: Drain mode enabled.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/undrain:
    post:
      tags: [Operations]
      operationId: disableDrain
      summary: Resume transfer admission.
      security:
        - apiKey: []
      responses:
        "200":
          description: Drain mode disabled.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: registerSession
      summary: Register or advance a source-IP boot epoch.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSessionRequest"
      responses:
        "201":
          description: Session was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            Session profile conflicts with an existing pin or release cutover,
            a required managed release is unavailable, the issuer's durable
            session/release snapshot is stale, or a concurrent registration for
            the same client superseded this request.
            A durable-precondition conflict commits no registration from that
            batch; wait for synchronization before retrying that conflict.
            A superseded request instead means another registration won and was
            committed. Do not blindly retry: coordinate with the winning caller,
            since another registration can rotate its artifact token.
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: The server has reached its configured live boot-session capacity.
          content:
            text/plain:
              schema:
                type: string
        "408":
          description: Request body exceeded the configured read deadline; connection closes.
        "413":
          description: Request body exceeds the configured size limit.
        "503":
          description: The bounded durable registration queue is full or unavailable; retry with backoff.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sessions/{client_ip}:
    delete:
      tags: [Sessions]
      operationId: revokeSession
      summary: Revoke the current boot session when its artifact token still matches.
      security:
        - apiKey: []
      parameters:
        - name: client_ip
          in: path
          required: true
          schema:
            type: string
            format: ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact_token]
              properties:
                artifact_token:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        "204":
          description: Matching session was revoked, or no session exists. With SQL persistence, this result is determined from durable state before clearing the local cache.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The client IP now belongs to a replacement session.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/versions:
    get:
      tags: [Releases]
      operationId: listVersions
      summary: List active managed artifact versions.
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Active artifact versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfoPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Versions API is disabled.
  /api/v1/versions/groups:
    get:
      tags: [Releases]
      operationId: listVersionGroups
      summary: List retained version groups and manifest metadata.
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Retained version groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInfoPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Versions API is disabled.
  /api/v1/versions/snapshot:
    get:
      tags: [Releases]
      operationId: getReleaseSnapshot
      summary: Return active versions and retained groups from one coherent snapshot.
      security:
        - apiKey: []
      responses:
        "200":
          description: Coherent release state for integrity controllers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Versions API is disabled.
        "503":
          description: Release state exceeds the bounded coherent-snapshot contract.
  /api/v1/versions/verify:
    post:
      tags: [Releases]
      operationId: verifyVersionGroupArtifacts
      summary: Rehash selected release artifacts through the capability-confined root.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyGroupRequest"
      responses:
        "200":
          description: Verification completed; a false result denotes a manifest mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The retained release group was not found or the Versions API is disabled.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The bounded artifact-verification worker pool is unavailable.
  /api/v1/versions/switch:
    post:
      tags: [Releases]
      operationId: switchVersionGroup
      summary: Prepare, validate, and activate a coordinated version group.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "200":
          description: Version group activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cutover timed out, conflicted with another mutation, or active/pinned history leaves no room within the 100-group limit.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/versions/rollback:
    post:
      tags: [Releases]
      operationId: rollbackVersionGroup
      summary: Reactivate a retained group in one boot profile.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rollback completed.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Mutation conflict.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/versions/withdraw:
    post:
      tags: [Releases]
      operationId: withdrawVersionGroup
      summary: Withdraw a profile only when group_id matches its active group.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMutationRequest"
      responses:
        "200":
          description: Active release withdrawn.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The boot profile has no active release.
        "409":
          description: Requested group is not active, cutover is active, or mutation conflicted.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/versions/rollback:
    post:
      tags: [Releases]
      operationId: rollbackVersionGroupExact
      summary: Reactivate a retained group using digest-bound identity.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExactRollbackRequest"
      responses:
        "200":
          description: Rollback completed.
        "400":
          description: No manifest digest was supplied or the identity was malformed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Mutation or exact-identity conflict.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/versions/withdraw:
    post:
      tags: [Releases]
      operationId: withdrawVersionGroupExact
      summary: Withdraw an active group using digest-bound identity.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExactGroupMutationRequest"
      responses:
        "200":
          description: Active release withdrawn.
        "400":
          description: manifest_digest is absent or the identity was malformed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The boot profile has no active release.
        "409":
          description: Requested exact identity is not active or mutation conflicted.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/artifacts/{filename}:
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Stream an artifact resolved through a bearer-authorized boot session.
      description: |
        This route is intentionally outside API-key middleware. The caller must
        present the opaque token returned by session registration as an
        Authorization bearer credential. The resolved client IP must match the session IP;
        a mismatch returns 403. The token is rotated on registration,
        shown only once, and accepted only while its session is live. Verified
        managed artifacts accept one bytes range and expose a strong ETag;
        unmanaged artifacts and multipart ranges fall back to a complete 200
        response.
      security:
        - artifactBearer: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Canonical relative logical artifact name. Nested paths and Unicode are permitted; empty/dot components, repeated or trailing separators, and backslashes are rejected before ownership lookup.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: Range
          in: header
          required: false
          description: One bytes range for a verified managed artifact.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          description: Strong artifact ETag; a mismatch returns the complete representation.
          schema:
            type: string
      responses:
        "200":
          description: Artifact stream.
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum: [bytes, none]
            ETag:
              schema:
                type: string
            x-tempest-boot-profile:
              schema:
                type: string
            x-tempest-transport:
              schema:
                type: string
                const: HTTP
            x-tempest-http-mode:
              schema:
                type: string
                const: bearer
            x-tempest-boot-phase:
              schema:
                type: string
            x-tempest-content-sha256:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
            x-tempest-group-id:
              schema:
                type: string
            x-tempest-manifest-digest:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested range of a verified managed artifact.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Range:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Artifact bearer token is missing, invalid, or expired.
        "403":
          description: Artifact is quarantined or request is outside the active session boundary.
        "404":
          description: Artifact was not found in the authorized session release or its logical name is fenced against unmanaged access. The response does not disclose ownership metadata.
        "409":
          description: Release cutover or session pin conflict.
        "416":
          description: The requested managed-artifact byte range is unsatisfiable.
          headers:
            Content-Range:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Tempest is draining, at transfer capacity, unable to reserve audit capacity, its ordinary SQL serving snapshot is unvalidated or at the configured maximum age, or deletion-mode SQL coordination is temporarily saturated.
  /boot/v1/{filename}:
    get:
      tags: [Artifacts]
      operationId: getNativeHttpBootArtifact
      summary: Stream the configured native UEFI boot artifact for a source-IP session.
      description: |
        This optional route is registered only when
        api.enable_native_http_boot is true. It accepts no API key or bearer
        credential. Tempest resolves the direct socket peer, or one numeric
        X-Forwarded-For value from an explicitly trusted proxy, and requires an
        unexpired boot session for that address. The requested name must exactly
        match api.native_http_boot_filename and resolve to a release-managed
        artifact in the session-pinned group; unmanaged root fallback is denied.
        One bytes range is supported, with the content hash exposed as a strong
        ETag. Multipart ranges fall back to the complete representation. Responses
        use Cache-Control no-store because selection depends on client IP.
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Configured canonical relative logical native boot artifact name; no empty/dot components, repeated or trailing separators, or backslashes.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: Range
          in: header
          required: false
          description: One bytes range of the managed boot artifact.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          description: Strong artifact ETag; a mismatch returns the complete representation.
          schema:
            type: string
      responses:
        "200":
          description: Native UEFI network boot program or bootable image stream.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            ETag:
              schema:
                type: string
            x-tempest-boot-profile:
              schema:
                type: string
            x-tempest-transport:
              schema:
                type: string
                const: HTTP_NATIVE
            x-tempest-http-mode:
              schema:
                type: string
                const: native
            x-tempest-content-sha256:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
            x-tempest-group-id:
              schema:
                type: string
            x-tempest-manifest-digest:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
          content:
            application/efi:
              schema:
                type: string
                format: binary
            application/vnd.efi.iso:
              schema:
                type: string
                format: binary
            application/vnd.efi.img:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested range of the managed boot artifact.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Range:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/efi:
              schema:
                type: string
                format: binary
            application/vnd.efi.iso:
              schema:
                type: string
                format: binary
            application/vnd.efi.img:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: No live source-IP session exists, or the artifact is denied or quarantined.
        "404":
          description: Route is disabled, name differs from configuration, or no managed artifact exists in the pinned release.
        "409":
          description: Release cutover or session pin conflict.
        "416":
          description: The requested byte range is unsatisfiable.
          headers:
            Content-Range:
              schema:
                type: string
        "429":
          description: HTTP source request rate exceeded.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Tempest is draining, at transfer capacity, unable to reserve audit capacity, its ordinary SQL serving snapshot is unvalidated or at the configured maximum age, or deletion-mode SQL coordination is temporarily saturated.
    head:
      tags: [Artifacts]
      operationId: headNativeHttpBootArtifact
      summary: Return native UEFI boot artifact metadata without a response body.
      description: Uses the same enablement, source-IP session, managed-release, and integrity checks as GET.
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: Artifact metadata, including Content-Length and the GET identity headers.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: No live source-IP session exists, or the artifact is denied or quarantined.
        "404":
          description: Route is disabled, name differs from configuration, or no managed artifact exists in the pinned release.
        "409":
          description: Release cutover or session pin conflict.
        "429":
          description: HTTP source request rate exceeded.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Tempest is draining, at transfer capacity, unable to reserve audit capacity, its ordinary SQL serving snapshot is unvalidated or at the configured maximum age, or deletion-mode SQL coordination is temporarily saturated.
  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: listAuditEntries
      summary: Return recent audit entries newest first.
      security:
        - apiKey: []
      parameters:
        - name: client_mac
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Unsigned delivery audit entries read from the durable JSONL write-ahead log.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Audit API is disabled.
        "503":
          description: Audit logging is not configured or audit-query capacity is exhausted.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Required for control and metrics routes outside explicit insecure development mode.
    artifactBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: One-time opaque token returned by boot-session registration.
  parameters:
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as next_cursor by the preceding page.
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Invalid request.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: API key is missing or invalid.
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Operation failed without exposing internal details.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    DeleteTarget:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, boot_profile, group_id]
          properties:
            kind:
              const: retained_group
            boot_profile:
              type: string
              pattern: '^[A-Za-z0-9_.-]{1,64}$'
            group_id:
              type: string
              pattern: '^[A-Za-z0-9_.-]{1,128}$'
        - type: object
          additionalProperties: false
          required: [kind, path]
          properties:
            kind:
              const: file
            path:
              type: string
              minLength: 1
              maxLength: 255
              description: Physical root-relative path; no parent/root components, backslashes or control characters. Limit is UTF-8 bytes.
    DeleteBlocker:
      type: string
      enum: [active_release, boot_session_pinned, transfer_pinned, cutover_in_progress, persistence_coordination_unavailable, byte_deletion_unavailable, retained_reference, reference_check_incomplete, ownership_fence_required]
    DeletePreview:
      type: object
      required: [target, expected_identity, can_delete, blockers, referring_groups]
      properties:
        target:
          $ref: '#/components/schemas/DeleteTarget'
        expected_identity:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Manifest digest for a group; opaque path/metadata/content identity for a file. Not authorization or a reservation.
        can_delete:
          type: boolean
        blockers:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/DeleteBlocker'
        referring_groups:
          type: array
          maxItems: 100
          items:
            type: object
            required: [boot_profile, group_id, manifest_digest]
            properties:
              boot_profile:
                type: string
              group_id:
                type: string
              manifest_digest:
                type: string
                pattern: '^[0-9a-f]{64}$'
    ConfirmDeleteRequest:
      type: object
      additionalProperties: false
      required: [target, expected_identity]
      properties:
        target:
          $ref: '#/components/schemas/DeleteTarget'
        expected_identity:
          type: string
          pattern: '^[0-9a-f]{64}$'
    DeleteResult:
      type: object
      required: [deleted, expected_identity, bytes_deleted]
      properties:
        deleted:
          $ref: '#/components/schemas/DeleteTarget'
        expected_identity:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bytes_deleted:
          const: false
    AuditEntry:
      type: object
      description: >-
        Unsigned operational record of one terminal delivery outcome. This is
        not a digital signature, tamper-evident chain, or external ledger.
      required:
        - sequence
        - client_ip
        - file_path
        - file_sha256
        - blocks_sent
        - retransmissions
        - outcome
        - timestamp
      properties:
        sequence:
          type: integer
          minimum: 0
        client_mac:
          type: string
        client_serial:
          type: string
        boot_profile:
          type: string
        client_ip:
          type: string
          format: ip
        file_path:
          type: string
        file_sha256:
          type: string
          description: Managed content digest when known. A failed outcome does not imply verified delivery.
        blocks_sent:
          type: integer
          minimum: 0
        retransmissions:
          type: integer
          minimum: 0
        outcome:
          oneOf:
            - type: string
              enum: [Completed, Redirected, Aborted, TimedOut]
            - type: object
              required: [Failed]
              additionalProperties: false
              properties:
                Failed:
                  type: string
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        delivery:
          $ref: "#/components/schemas/AuditDeliveryIdentity"
      additionalProperties: false
    AuditDeliveryIdentity:
      type: object
      required:
        - transfer_id
        - phase
        - transport
      properties:
        transfer_id:
          type: string
        group_id:
          type: string
        artifact_version_id:
          type: integer
          minimum: 0
        manifest_digest:
          type: string
        phase:
          type: string
        transport:
          type: string
          enum: [TFTP, HTTP, HTTP_NATIVE]
      additionalProperties: false
    ServerInfo:
      type: object
      required: [name, version, tftp_port, active_transfers, drain_mode, uptime_secs]
      properties:
        name:
          type: string
          const: Tempest
        version:
          type: string
        tftp_port:
          type: integer
          minimum: 0
          maximum: 65535
        active_transfers:
          type: integer
          minimum: 0
        drain_mode:
          type: boolean
        uptime_secs:
          type: integer
          minimum: 0
    ActiveTransfers:
      type: object
      required: [count, drain_mode]
      properties:
        count:
          type: integer
          minimum: 0
        drain_mode:
          type: boolean
    DrainStatus:
      type: object
      required: [drain_mode, active_transfers, queued_transfers, drain_complete]
      properties:
        drain_mode:
          type: boolean
        active_transfers:
          type: integer
          minimum: 0
        queued_transfers:
          type: integer
          minimum: 0
        drain_complete:
          type: boolean
    RegisterSessionRequest:
      type: object
      required: [client_ip]
      properties:
        client_ip:
          type: string
          format: ip
        trace_id:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9-]{1,128}$"
        boot_profile:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          default: default
        client_mac:
          type: [string, "null"]
          description: Colon, dash, or compact 12-hex format.
        serial:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        ttl_seconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 3600
          default: 600
        new_epoch:
          type: boolean
          default: false
        require_managed:
          type: boolean
          default: false
          description: Return 409 without creating a session if no release can be pinned.
      anyOf:
        - required: [boot_profile]
        - required: [trace_id]
        - required: [client_mac]
        - required: [serial]
    RegisterSessionResponse:
      type: object
      required: [artifact_token, expires_at, boot_epoch, boot_profile, manifest_digest]
      properties:
        boot_profile:
          type: string
        manifest_digest:
          type: [string, "null"]
          description: Pinned release manifest digest; null for an unmanaged session.
        artifact_token:
          type: string
          minLength: 64
          maxLength: 64
          description: Opaque bearer token shown once; persistence stores only its SHA-256 digest.
        expires_at:
          type: string
          format: date-time
        boot_epoch:
          type: integer
          minimum: 1
    DeployRequest:
      type: object
      required: [group_id, files]
      properties:
        boot_profile:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          default: default
        group_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        files:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FileMapping"
        drain_timeout_ms:
          type: [integer, "null"]
          minimum: 0
          maximum: 300000
          default: 30000
        cutover_policy:
          type: string
          enum: [drain_all, preserve_sessions]
          default: drain_all
    FileMapping:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Safe relative logical TFTP path.
        path:
          type: string
          minLength: 1
          description: Existing regular file beneath the configured TFTP root.
    GroupMutationRequest:
      type: object
      required: [group_id]
      properties:
        boot_profile:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          default: default
        group_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        manifest_digest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: Reject the withdrawal unless this exact release is active.
    ExactGroupMutationRequest:
      allOf:
        - $ref: "#/components/schemas/GroupMutationRequest"
        - type: object
          required: [manifest_digest]
          properties:
            manifest_digest:
              type: string
              pattern: "^[0-9a-f]{64}$"
    RollbackRequest:
      type: object
      required: [group_id]
      properties:
        boot_profile:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          default: default
        group_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        manifest_digest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: Exact retained rollback target.
        expected_active_group:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          description: Reject the rollback if this group is no longer active.
        expected_active_manifest_digest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: Exact active release expected by the caller.
    ExactRollbackRequest:
      allOf:
        - $ref: "#/components/schemas/RollbackRequest"
        - type: object
          required: [manifest_digest]
          properties:
            manifest_digest:
              type: string
              pattern: "^[0-9a-f]{64}$"
    VerifyGroupRequest:
      type: object
      required: [boot_profile, group_id, manifest_digest, files]
      properties:
        boot_profile:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        group_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        files:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 255
    VerifyGroupResponse:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
    VersionInfo:
      type: object
      required: [boot_profile, name, version_id, content_hash, size]
      properties:
        boot_profile:
          type: string
        name:
          type: string
        version_id:
          type: integer
          minimum: 1
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size:
          type: integer
          minimum: 0
    GroupInfo:
      type: object
      required:
        - boot_profile
        - group_id
        - version_id
        - files
        - created_at
        - manifest_digest
        - manifest_signature
      properties:
        boot_profile:
          type: string
        group_id:
          type: string
        version_id:
          type: integer
          minimum: 1
        files:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VersionInfo"
        created_at:
          type: string
          format: date-time
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        manifest_signature:
          type: [string, "null"]
    VersionInfoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VersionInfo"
        next_cursor:
          type: [string, "null"]
    GroupInfoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GroupInfo"
        next_cursor:
          type: [string, "null"]
    ReleaseSnapshot:
      type: object
      required: [versions, active_groups, groups]
      properties:
        versions:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/VersionInfo"
        active_groups:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ActiveGroupInfo"
        groups:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GroupInfo"
    ActiveGroupInfo:
      type: object
      required: [boot_profile, group_id, version_id, manifest_digest]
      properties:
        boot_profile:
          type: string
        group_id:
          type: string
        version_id:
          type: integer
          minimum: 1
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
