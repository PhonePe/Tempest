name: tempest-dual-plane

x-tempest-common: &tempest-common
  image: ${TEMPEST_IMAGE:?set TEMPEST_IMAGE to an immutable Tempest image reference}
  network_mode: host
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
  env_file:
    - ${TEMPEST_ENV_FILE:?set TEMPEST_ENV_FILE to the protected runtime environment file}
  stop_signal: SIGTERM
  stop_grace_period: ${TEMPEST_STOP_GRACE_PERIOD:-45s}
  restart: unless-stopped
  pids_limit: 1024
  ulimits:
    nofile:
      soft: ${TEMPEST_NOFILE_SOFT:-65536}
      hard: ${TEMPEST_NOFILE_HARD:-65536}
  logging:
    driver: json-file
    options:
      max-size: ${TEMPEST_LOG_MAX_SIZE:-50m}
      max-file: ${TEMPEST_LOG_MAX_FILES:-5}

services:
  tempest-l2:
    <<: *tempest-common
    container_name: tempest-l2
    command: ["--config", "/etc/tempest/tempest.toml"]
    environment:
      TOKIO_WORKER_THREADS: ${TEMPEST_L2_WORKER_THREADS:-1}
    volumes:
      - type: bind
        source: ${TEMPEST_L2_CONFIG:?set TEMPEST_L2_CONFIG to the rendered L2 configuration}
        target: /etc/tempest/tempest.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TEMPEST_ARTIFACT_ROOT:?set TEMPEST_ARTIFACT_ROOT to the immutable artifact tree}
        target: /tftpboot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TEMPEST_L2_AUDIT_DIR:?set TEMPEST_L2_AUDIT_DIR to an existing UID 10001 writable directory}
        target: /var/log/tempest
        bind:
          create_host_path: false

  tempest-l3:
    <<: *tempest-common
    container_name: tempest-l3
    command: ["--config", "/etc/tempest/tempest.toml"]
    environment:
      TOKIO_WORKER_THREADS: ${TEMPEST_L3_WORKER_THREADS:-5}
    volumes:
      - type: bind
        source: ${TEMPEST_L3_CONFIG:?set TEMPEST_L3_CONFIG to the rendered L3 configuration}
        target: /etc/tempest/tempest.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TEMPEST_ARTIFACT_ROOT:?set TEMPEST_ARTIFACT_ROOT to the immutable artifact tree}
        target: /tftpboot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TEMPEST_L3_AUDIT_DIR:?set TEMPEST_L3_AUDIT_DIR to an existing UID 10001 writable directory}
        target: /var/log/tempest
        bind:
          create_host_path: false
