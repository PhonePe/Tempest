name: tempest-https

services:
  tempest-https:
    image: ${TEMPEST_TLS_IMAGE:?set TEMPEST_TLS_IMAGE to a reviewed immutable nginx image reference}
    network_mode: host
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - type: bind
        source: ${TEMPEST_TLS_CONFIG:?set TEMPEST_TLS_CONFIG to the rendered nginx configuration}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TEMPEST_TLS_DIR:?set TEMPEST_TLS_DIR to the certificate directory}
        target: /etc/tempest/tls
        read_only: true
        bind:
          create_host_path: false
    stop_signal: SIGQUIT
    stop_grace_period: 5m
    restart: unless-stopped
    pids_limit: 64
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
