name: Fuzz

on:
  pull_request:
    paths:
      - "src/protocol/**"
      - "fuzz/**"
      - "Makefile"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's caches but never write their own, so
          # they cannot evict main's entries from the repository cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz packet parser and option negotiation
        run: make fuzz
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tempest-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
