name: Upcoming Rust

# Early warning before the pinned toolchain (rust-toolchain.toml) is bumped:
# build, lint and test on the newest stable and beta compilers. Failures here
# do not block merges; fix them in the next toolchain-bump change.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upcoming:
    name: Rust ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ matrix.channel }}
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.channel }}
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --lib --tests --all-features
