name: Feature request
description: Propose a focused core capability or public contract change.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem, not only a proposed implementation.
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owning surface
      options:
        - Core protocol or lifecycle
        - HTTP or OpenAPI contract
        - Persistence
        - Public extension trait
        - Documentation or tooling
        - Unsure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include compatibility, bounds, fallback, and failure semantics.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Workload or interoperability evidence
      description: Describe clients, scale, network conditions, or measurements where relevant.